
name: Validate Expo configuration

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'app.json'
      - '.github/workflows/node.js.yml'

jobs:
  validate:
    name: Validate Expo configuration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check app.json exists
        run: |
          test -f app.json || {
            echo "ERROR: app.json is missing from the repository root."
            echo "Repository files:"
            ls -la
            exit 1
          }

      - name: Validate app.json
        run: node -e "const fs = require('fs'); const config = JSON.parse(fs.readFileSync('./app.json', 'utf8')); if (!config.expo || !config.expo.android || !config.expo.android.package) throw new Error('Missing Expo Android package'); console.log('app.json is valid'); console.log('Android package:', config.expo.android.package)"
